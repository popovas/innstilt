<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- GENERATED by render.py from icon-ghost.svg (maskable). No Vy logo, name or wordmark anywhere: it's a generic
       green commuter ghost under a generic black/yellow departure board. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5a4a"/>
      <stop offset="1" stop-color="#0e3a30"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2faf5"/>
      <stop offset=".75" stop-color="#cfeadb"/>
      <stop offset="1" stop-color="#cfeadb" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06221b" stop-opacity=".6"/>
      <stop offset="1" stop-color="#06221b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">

  <!-- empty track -->
  <g fill="#0a2c24">
    <rect x="58" y="416" width="26" height="14" rx="3"/><rect x="128" y="416" width="26" height="14" rx="3"/>
    <rect x="198" y="416" width="26" height="14" rx="3"/><rect x="268" y="416" width="26" height="14" rx="3"/>
    <rect x="338" y="416" width="26" height="14" rx="3"/><rect x="408" y="416" width="26" height="14" rx="3"/>
  </g>
  <rect x="40" y="406" width="432" height="10" rx="5" fill="#8fbfa8"/>

  <!-- the shadow of a train that isn't there -->
  <ellipse cx="262" cy="404" rx="150" ry="12" fill="url(#shadow)"/>

  <!-- ghost carriage: commuter-unit body, sheet-ghost hem -->
  <path d="M96 196 Q96 156 138 156 H330 Q392 156 414 222 L424 262 Q430 290 414 306 L414 360
           Q394 344 374 360 Q354 376 334 360 Q314 344 294 360 Q274 376 254 360 Q234 344 214 360
           Q194 376 174 360 Q154 344 134 360 Q114 376 96 360 Z"
        fill="url(#ghost)"/>

  <!-- window band -->
  <path d="M114 188 H336 Q372 188 388 226 L394 244 H114 Z" fill="#14473b"/>
  <!-- eyes in the windows: half-closed, couldn't care less -->
  <g fill="#e9f6ee">
    <ellipse cx="190" cy="217" rx="22" ry="19"/>
    <ellipse cx="280" cy="217" rx="22" ry="19"/>
  </g>
  <g fill="#0e3a30">
    <circle cx="196" cy="224" r="8"/>
    <circle cx="286" cy="224" r="8"/>
  </g>
  <!-- heavy lids -->
  <path d="M166 217 A24 22 0 0 1 214 217 Z" fill="#14473b"/>
  <path d="M256 217 A24 22 0 0 1 304 217 Z" fill="#14473b"/>
  <path d="M166 217 H214 M256 217 H304" stroke="#cfeadb" stroke-width="4" stroke-linecap="round"/>
  <!-- cab window -->
  <path d="M332 196 H340 Q362 196 374 230 L378 240 H332 Z" fill="#2c6b59"/>

  <!-- mouth: a flat "meh" -->
  <path d="M206 284 Q236 276 266 286" fill="none" stroke="#14473b" stroke-width="7" stroke-linecap="round"/>

  <!-- livery stripe, fading out -->
  <path d="M96 318 H414 V336 H96 Z" fill="#2fa36b" opacity=".85"/>
  <!-- headlight, switched off -->
  <circle cx="404" cy="282" r="8" fill="#9cc3b0"/>

  <!-- asleep on the job: big enough to read at 180 px -->
  <g font-family="'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
     fill="#f2faf5" stroke="#0e3a30" stroke-width="3" paint-order="stroke">
    <text x="414" y="222" font-size="48" transform="rotate(-12 414 222)">z</text>
    <text x="446" y="180" font-size="68" transform="rotate(-12 446 180)">z</text>
  </g>

  <!-- floating wisps -->
  <path d="M60 236 Q74 228 66 214 M54 290 Q70 282 60 266" fill="none" stroke="#cfeadb" stroke-width="5" stroke-linecap="round" opacity=".5"/>

  <!-- departure-board status: black panel, yellow warning -->
  <g>
    <rect x="78" y="52" width="356" height="84" rx="10" fill="#0b0b0c"/>
    <rect x="78" y="52" width="356" height="84" rx="10" fill="none" stroke="#2a2d2f" stroke-width="3"/>
    <circle cx="130" cy="94" r="25" fill="#f5c400"/>
    <rect x="126" y="76" width="8" height="24" rx="4" fill="#0b0b0c"/>
    <circle cx="130" cy="110" r="5" fill="#0b0b0c"/>
    <text x="290" y="112" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800"
          font-size="50" fill="#f5c400" textLength="250" lengthAdjust="spacingAndGlyphs">Innstilt</text>
  </g>
  </g>
</svg>
