[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innstilt"
version = "0.1.0"
description = "Claim your money back from Vy for delayed and cancelled trains. Not affiliated with Vy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "playwright>=1.45",  # exporting Entur archive days nobody has exported yet; optional assistant window
]

[project.scripts]
innstilt = "innstilt:main"

[tool.setuptools]
py-modules = ["innstilt"]
